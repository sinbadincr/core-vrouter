# Same as cn1.conf but vm3 (p3) has no static neighbour, so p3 is unbound (learning, hold queue).
port add p1 ifname p1 ip 10.0.1.1/24
port add p2 ifname p2 ip 10.0.1.1/24
port add p3 ifname p3 ip 10.0.2.1/24
neigh add 10.0.1.11 lladdr 02:00:00:00:01:01 dev p1
neigh add 10.0.1.12 lladdr 02:00:00:00:01:02 dev p2
icmp-ratelimit rate 100 burst 20
